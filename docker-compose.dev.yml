# Development Docker Compose configuration.
#
# Architecture (hybrid — API runs on host macOS):
#   - API server: runs on the HOST via `pnpm --filter @web-mobile-simulator/api run dev`
#     because it needs access to macOS-native tools (xcrun simctl, avdmanager, adb, emulator).
#   - Angular dev server: runs in Docker (web service, port 4200).
#   - nginx: runs in Docker (port 8080), reverse-proxies:
#       /api/*, /ws/*  → host.docker.internal:3000 (host API)
#       /*             → web:4200 (Angular dev server)
#
# Usage:
#   1. Start API on host:  pnpm --filter @web-mobile-simulator/shared build && pnpm --filter @web-mobile-simulator/api run dev
#   2. Start Docker:       docker compose -f docker-compose.dev.yml up --build
#   3. Open browser:       http://localhost:8080

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      # Bind-mount source for hot reload (read-only — edits happen on host)
      - ./packages/shared/src:/app/packages/shared/src:ro
      - ./packages/shared/tsconfig.json:/app/packages/shared/tsconfig.json:ro
      - ./packages/web/src:/app/packages/web/src:ro
      - ./packages/web/public:/app/packages/web/public:ro
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
      - ./packages/web/tsconfig.json:/app/packages/web/tsconfig.json:ro
      - ./packages/web/tsconfig.app.json:/app/packages/web/tsconfig.app.json:ro
      - ./packages/web/angular.json:/app/packages/web/angular.json:ro
      - ./packages/web/proxy.conf.json:/app/packages/web/proxy.conf.json:ro
    environment:
      - NODE_ENV=development
    # Build shared types first, then start Angular dev server (allowedHosts configured in angular.json)
    command: sh -c "pnpm --filter @web-mobile-simulator/shared build && pnpm --filter @web-mobile-simulator/web exec ng serve --host 0.0.0.0 --port 4200"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped

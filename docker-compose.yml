version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3000:3000"
    environment:
      - API_PORT=3000
      - API_HOST=0.0.0.0
      - DATABASE_URL=file:/app/data/simulator.db
      - XCODE_PATH=/Applications/Xcode.app
      - ANDROID_SDK_ROOT=/Users/shared/Library/Android/sdk
    volumes:
      - api-data:/app/data
      # Mount host paths for simulator/emulator access (macOS specific)
      # These will be needed when implementing actual simulator control
      # - /var/run/docker.sock:/var/run/docker.sock
    # Use host networking on macOS for access to simulators/emulators
    # Uncomment when ready to integrate with host simulators:
    # network_mode: host
    restart: unless-stopped

volumes:
  api-data:

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3000:3000"
    environment:
      - API_PORT=3000
      - API_HOST=0.0.0.0
      - DATABASE_URL=file:/app/data/simulator.db
      - XCODE_PATH=/Applications/Xcode.app
      - ANDROID_SDK_ROOT=/Users/shared/Library/Android/sdk
    volumes:
      - api-data:/app/data
    restart: unless-stopped

volumes:
  api-data:

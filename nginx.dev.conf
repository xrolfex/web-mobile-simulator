# Development reverse proxy configuration for nginx.
#
# Architecture:
#   - API server runs on the HOST macOS (not in Docker) because it needs
#     access to Xcode CLI tools (xcrun simctl), Android SDK (avdmanager,
#     emulator, adb), and other macOS-native binaries.
#   - Angular dev server runs in Docker (web container on port 4200).
#   - nginx runs in Docker and proxies:
#       /api/*  → host.docker.internal:3000 (API on host)
#       /ws/*   → host.docker.internal:3000 (WebSocket on host)
#       /*      → web:4200 (Angular dev server in Docker)

server {
    listen 8080;
    server_name _;

    # Docker's embedded DNS — required to resolve host.docker.internal at runtime
    resolver 127.0.0.11 valid=30s;

    # API reverse proxy
    location /api/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket proxy for real-time events
    location /ws/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Everything else → Angular dev server (including Vite HMR WebSocket)
    location / {
        proxy_pass http://web:4200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    access_log /dev/stdout;
    error_log /dev/stderr;
}
